name: Update Homebrew Formula

on:
  workflow_call:
    inputs:
      tag:
        description: Tag to publish in the Homebrew tap
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_GITHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homebrew-statusbar
  cancel-in-progress: false

jobs:
  update-homebrew-formula:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Update Homebrew formula
        run: ./.github/scripts/update-homebrew-formula.sh "${{ inputs.tag }}"
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
